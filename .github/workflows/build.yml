name: Build Chess 1v1 APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Capacitor and Generate Icon
        run: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps
          npx cap add android
          mkdir -p assets
          if [ -f "www/icon.svg" ] && [ ! -f "assets/icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y librsvg2-bin
            rsvg-convert -w 1024 -h 1024 www/icon.svg -o assets/icon.png
          fi
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chess1v1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
