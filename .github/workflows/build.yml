name: Build Chess 1v1 APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web Files and Build Setup
        run: |
          mkdir -p www assets
          [ -f "index.html" ] && [ ! -f "www/index.html" ] && mv index.html www/
          [ -f "manifest.json" ] && [ ! -f "www/manifest.json" ] && mv manifest.json www/
          [ -f "icon.png" ] && [ ! -f "assets/icon.png" ] && cp icon.png assets/icon.png
          [ -f "www/icon.png" ] && [ ! -f "assets/icon.png" ] && cp www/icon.png assets/icon.png
          npm install --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps
          npx cap add android
          if [ -f "assets/icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert assets/icon.png -resize 1024x1024! PNG32:assets/icon.png
            npx capacitor-assets generate --android
          fi
          npx cap sync android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chess1v1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
